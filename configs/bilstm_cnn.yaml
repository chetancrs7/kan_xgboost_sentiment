model_name: bilstm_cnn

# TODO: Add dataset to as a command line argument
random_state: 42
num_classes: 2

dataset:
  name: sentiment140
  path: data/raw/sentiment140_dataset.csv
  encoding: latin-1
  header: false
  text_column: text
  label_column: target
  # sample_size: 100000

preprocessing:
  vocab_size: 20000
  max_length: 200
  padding: post
  truncating: post
  lowercase: true

training:
  batch_size: 64
  epochs: 15
  learning_rate: 0.001
  test_size: 0.2
  validation_split: 0.15
  early_stopping_patience: 2
  verbose: 1

model:
  embedding_dim: 128
  lstm_units: 128
  filters: 128
  kernel_size: 3
  dense_units: 64
  dropout_rate: 0.5

output:
  save_dir: outputs/bilstm_cnn
