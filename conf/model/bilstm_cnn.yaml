# BiLSTM-CNN deep-learning baseline (TensorFlow/Keras).
#
#   python src/train.py model=bilstm_cnn
#   python src/train.py model=bilstm_cnn train.bilstm_cnn.epochs=5 model.max_length=150
#
# Like the other baselines this reads the pre-split CSVs (data.splits).
# Architecture hyperparameters (LSTM units, dropout) are grid-searched on
# the validation split by the pipeline itself; the epoch budget for the
# final fit lives under train.bilstm_cnn.

name: bilstm_cnn

# Maximum tokenizer vocabulary size.
vocab_size: 20000

# Padded/truncated sequence length.
max_length: 200
