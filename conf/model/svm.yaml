# TF-IDF + Linear SVM baseline.
#
#   python src/train.py model=svm
#   python src/train.py model=svm model.max_features=30000 model.c_values=[0.5,1.0]
#
# Tunes C x class_weight on the validation split, then refits and reports
# test metrics (evaluation only; this baseline does not save a model file).

name: svm

# Maximum TF-IDF vocabulary size (null = unlimited).
max_features: 50000
# Regularisation strengths evaluated during tuning.
c_values: [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]
# Class-weight options evaluated during tuning (null = uniform).
class_weights: [null, balanced]
# Validation metric used to pick the best candidate.
scoring: f1_macro
